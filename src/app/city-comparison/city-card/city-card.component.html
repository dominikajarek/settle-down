@let name = city().city | lowercase | appCityName;

<p-card>
  <ng-template #header>
    <img alt="Card" src="assets/{{ name }}/{{ name }}.jpg" />
  </ng-template>
  <ng-template #title> {{ city().city }} </ng-template>
  <ng-template #subtitle> </ng-template>
  <p>{{ city().description }}</p>
  <ng-template #footer>
    <p-button
      label="See more"
      routerLink="/cities/{{ city().id }}"
      ariaLabel="See more about {{ city().city }}"
    />
  </ng-template>
</p-card>
